<script>
  // ------------------------------------------------------------------
  // PWA SERVICE WORKER & INSTALLATION PROMPT (UPDATED PATHS)
  // ------------------------------------------------------------------
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      // Uses relative path './sw.js' so it works on any Vercel/GitHub URL
      navigator.serviceWorker.register('./sw.js')
        .then((reg) => console.log('Service Worker active on scope:', reg.scope))
        .catch((err) => console.error('Service Worker failed to register:', err));
    });
  }

  let deferredPrompt;
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    const installBtn = document.getElementById('pwa-install-btn');
    if (installBtn) installBtn.classList.remove('hidden');
  });

  function installPWA() {
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    deferredPrompt.userChoice.then((choiceResult) => {
      if (choiceResult.outcome === 'accepted') {
        console.log('PWA installation accepted');
      }
      deferredPrompt = null;
      document.getElementById('pwa-install-btn').classList.add('hidden');
    });
  }
</script>
